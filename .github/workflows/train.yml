name: Train & Evaluate - VT Detection Pipeline

# Runs the full DVC pipeline: prepare -> train -> evaluate -> reference -> gate.
# - Manual runs (workflow_dispatch) enforce the gate: the job fails if the model
#   misses gate.thresholds in configs/training_config.yaml, otherwise the new
#   version is promoted to "champion" in the MLflow registry (which lives only
#   for this job).
# - Push runs are report-only: the gate table is shown on the run summary,
#   but a miss doesn't fail the job and nothing is promoted.
# A successful run uploads "model-bundle" (the registered model + its
# reference profile), which drift.yml serves and checks.
#
# Defaults are smoke-test sized: GitHub-hosted runners are CPU-only and cap
# jobs at 6 hours, and VGG16 on the full dataset takes hours per epoch.
# Use workflow_dispatch inputs for larger runs (or a self-hosted/GPU runner).

on:
  workflow_dispatch:
    inputs:
      sample_fraction:
        description: "Fraction of dataset to use (applies to train/val/test; 1.0 = full)"
        required: false
        default: "0.01"
      epochs:
        description: "Number of training epochs"
        required: false
        default: "1"

  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "configs/**"
      - "dvc.yaml"
      - "scripts/ci_*.py"
      - ".github/workflows/train.yml"

jobs:
  train-and-evaluate:
    name: DVC Pipeline - Train & Evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download MIT-BIH dataset from PhysioNet (with retries)
        run: |
          mkdir -p data/MIT_dataset
          pip install wfdb
          for attempt in 1 2 3 4 5; do
            echo "Dataset download attempt ${attempt}/5"
            python3 scripts/ci_download_dataset.py && break
            if [ "$attempt" -eq 5 ]; then
              echo "Dataset download failed after 5 attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Apply runtime config overrides
        env:
          SAMPLE_FRACTION: ${{ github.event.inputs.sample_fraction || '0.01' }}
          EPOCHS: ${{ github.event.inputs.epochs || '1' }}
        run: python3 scripts/ci_update_config.py

      - name: DVC prepare (data preprocessing)
        run: dvc repro -s prepare --force

      - name: DVC train (VGG16 transfer learning)
        run: |
          set +e
          dvc repro -s train --force -v
          TRAIN_EXIT_CODE=$?
          echo "DVC train exit code: ${TRAIN_EXIT_CODE}"
          ls -lah models || true
          ls -lah models/artifacts || true
          if [ -f models/metrics.json ]; then
            echo "=== models/metrics.json ==="
            cat models/metrics.json
          else
            echo "models/metrics.json not found"
          fi
          if [ ${TRAIN_EXIT_CODE} -ne 0 ]; then
            exit ${TRAIN_EXIT_CODE}
          fi

      - name: DVC evaluate (metrics + plots)
        run: dvc repro -s evaluate --force

      - name: DVC reference (drift-monitoring baseline)
        run: dvc repro -s reference --force

      # Manual runs: enforce the gate. Fails the job if any threshold is missed,
      # otherwise promotes the new version to "champion".
      - name: DVC gate (enforced, promotes on pass)
        if: github.event_name == 'workflow_dispatch'
        run: dvc repro -s gate --force

      # Push runs train a smoke-sized model that isn't expected to meet the
      # thresholds, so report the gate result without failing or promoting.
      - name: Gate (report-only on push)
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "_Report-only: push-triggered smoke run. Run this workflow manually to enforce the gate._" >> "$GITHUB_STEP_SUMMARY"
          python -m src.evaluation.gate \
            --config configs/training_config.yaml \
            --report reports/evaluation_report.json \
            --output reports/gate.json \
            --no-promote

      # Skipped when an earlier step failed (e.g. the enforced gate), so only
      # models that made it through the pipeline get monitored.
      - name: Export model bundle (registered model + reference profile)
        run: python scripts/ci_export_model.py

      - name: Upload model bundle (used by the drift workflow)
        uses: actions/upload-artifact@v7
        with:
          name: model-bundle
          path: model-bundle/
          # Kept longer than the reports: the weekly drift check needs it until
          # the next training run.
          retention-days: 90

      - name: Upload evaluation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-report
          path: |
            reports/evaluation_report.json
            reports/gate.json
            models/metrics.json
            data/monitoring/reference.csv
          retention-days: 30

      - name: Upload plots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-plots
          path: plots/
          retention-days: 30

      - name: Upload trained model
        uses: actions/upload-artifact@v7
        # Keep the model even when the gate fails, so it can be inspected.
        if: always()
        with:
          name: vgg16-model
          path: models/artifacts/vgg16_best.keras
          retention-days: 30

      - name: Show training metrics
        if: always()
        run: |
          echo "=== TRAINING METRICS ==="
          cat models/metrics.json 2>/dev/null || echo "metrics.json not found"

      - name: Show evaluation summary
        if: always()
        run: |
          echo "=== EVALUATION SUMMARY ==="
          python3 scripts/ci_print_metrics.py
