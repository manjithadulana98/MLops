name: Train & Evaluate - VT Detection Pipeline

# Runs the full DVC pipeline: prepare -> train -> evaluate -> reference -> gate.
# - Manual runs (workflow_dispatch) enforce the gate: the job fails if the model
#   misses gate.thresholds in configs/training_config.yaml, otherwise the new
#   version is promoted to "champion" in the MLflow registry (which lives only
#   for this job).
# - Push runs are report-only: the gate table is shown on the run summary,
#   but a miss doesn't fail the job and nothing is promoted.
# A successful run uploads "model-bundle" (the registered model + its
# reference profile), which drift.yml serves and checks.
# When a manual run promotes a new champion, the publish-image job builds it
# as a Docker image, smoke-tests it and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/vt-detector:champion and :run-<run number>).
#
# Defaults are smoke-test sized: GitHub-hosted runners are CPU-only and cap
# jobs at 6 hours, and VGG16 on the full dataset takes hours per epoch.
# Use workflow_dispatch inputs for larger runs (or a self-hosted/GPU runner).

on:
  workflow_dispatch:
    inputs:
      sample_fraction:
        description: "Fraction of dataset to use (applies to train/val/test; 1.0 = full)"
        required: false
        default: "0.01"
      epochs:
        description: "Number of training epochs"
        required: false
        default: "1"

  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "configs/**"
      - "dvc.yaml"
      - "scripts/ci_*.py"
      - ".github/workflows/train.yml"

jobs:
  train-and-evaluate:
    name: DVC Pipeline - Train & Evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download MIT-BIH dataset from PhysioNet (with retries)
        run: |
          mkdir -p data/MIT_dataset
          pip install wfdb
          for attempt in 1 2 3 4 5; do
            echo "Dataset download attempt ${attempt}/5"
            python3 scripts/ci_download_dataset.py && break
            if [ "$attempt" -eq 5 ]; then
              echo "Dataset download failed after 5 attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Apply runtime config overrides
        env:
          SAMPLE_FRACTION: ${{ github.event.inputs.sample_fraction || '0.01' }}
          EPOCHS: ${{ github.event.inputs.epochs || '1' }}
        run: python3 scripts/ci_update_config.py

      - name: DVC prepare (data preprocessing)
        run: dvc repro -s prepare --force

      - name: DVC train (VGG16 transfer learning)
        run: |
          set +e
          dvc repro -s train --force -v
          TRAIN_EXIT_CODE=$?
          echo "DVC train exit code: ${TRAIN_EXIT_CODE}"
          ls -lah models || true
          ls -lah models/artifacts || true
          if [ -f models/metrics.json ]; then
            echo "=== models/metrics.json ==="
            cat models/metrics.json
          else
            echo "models/metrics.json not found"
          fi
          if [ ${TRAIN_EXIT_CODE} -ne 0 ]; then
            exit ${TRAIN_EXIT_CODE}
          fi

      - name: DVC evaluate (metrics + plots)
        run: dvc repro -s evaluate --force

      - name: DVC reference (drift-monitoring baseline)
        run: dvc repro -s reference --force

      # Manual runs: enforce the gate. Fails the job if any threshold is missed,
      # otherwise promotes the new version to "champion".
      - name: DVC gate (enforced, promotes on pass)
        if: github.event_name == 'workflow_dispatch'
        run: dvc repro -s gate --force

      # Push runs train a smoke-sized model that isn't expected to meet the
      # thresholds, so report the gate result without failing or promoting.
      - name: Gate (report-only on push)
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "_Report-only: push-triggered smoke run. Run this workflow manually to enforce the gate._" >> "$GITHUB_STEP_SUMMARY"
          python -m src.evaluation.gate \
            --config configs/training_config.yaml \
            --report reports/evaluation_report.json \
            --output reports/gate.json \
            --no-promote

      # Skipped when an earlier step failed (e.g. the enforced gate), so only
      # models that made it through the pipeline get monitored.
      - name: Export model bundle (registered model + reference profile)
        run: python scripts/ci_export_model.py

      - name: Upload model bundle (used by the drift workflow)
        uses: actions/upload-artifact@v7
        with:
          name: model-bundle
          path: model-bundle/
          # Kept longer than the reports: the weekly drift check needs it until
          # the next training run.
          retention-days: 90

      - name: Upload evaluation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-report
          path: |
            reports/evaluation_report.json
            reports/gate.json
            models/metrics.json
            data/monitoring/reference.csv
          retention-days: 30

      - name: Upload plots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-plots
          path: plots/
          retention-days: 30

      - name: Upload trained model
        uses: actions/upload-artifact@v7
        # Keep the model even when the gate fails, so it can be inspected.
        if: always()
        with:
          name: vgg16-model
          path: models/artifacts/vgg16_best.keras
          retention-days: 30

      - name: Show training metrics
        if: always()
        run: |
          echo "=== TRAINING METRICS ==="
          cat models/metrics.json 2>/dev/null || echo "metrics.json not found"

      - name: Show evaluation summary
        if: always()
        run: |
          echo "=== EVALUATION SUMMARY ==="
          python3 scripts/ci_print_metrics.py

  # Manual runs only: there the gate is enforced, so if the training job
  # succeeded, its model is the new champion.
  publish-image:
    name: Publish champion image to GHCR
    needs: train-and-evaluate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download model bundle
        uses: actions/download-artifact@v8
        with:
          name: model-bundle
          path: model-bundle

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Only the MLflow CLI is needed here; the model's own requirements are
      # installed inside the image.
      - name: Install MLflow (the version the model was logged with)
        run: pip install "$(grep -E '^mlflow==' model-bundle/model/requirements.txt)"

      # The image is ~6 GB; preinstalled SDKs this job doesn't use free ~20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        run: |
          mlflow models generate-dockerfile -m model-bundle/model -d build/docker
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vt-detector"
          tag="run-${GITHUB_RUN_NUMBER}"
          docker build build/docker -t "$image:$tag" -t "$image:champion" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=VT/PVC detector, MLflow training run $(jq -r .training_run_id model-bundle/bundle.json)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker image ls "$image"

      # Push only an image that starts and answers a real request.
      - name: Smoke-test image
        run: |
          docker run -d --name vt-detector -p 8080:8080 "$IMAGE:$TAG"
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ping > /dev/null && break
            sleep 5
          done
          curl -sf -H "Content-Type: application/json" \
            -d @model-bundle/model/serving_input_example.json \
            http://127.0.0.1:8080/invocations > response.json
          python -c "import json; p = json.load(open('response.json'))['predictions']; assert p and all(0 <= x <= 1 for x in p), p; print('predictions:', p)"

      - name: Show container log
        if: failure()
        run: docker logs vt-detector 2>&1 | tail -n 100 || true

      - name: Push to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          {
            echo "### Published image"
            echo ""
            echo "\`$IMAGE:$TAG\` (also tagged \`champion\`)"
            echo ""
            echo "\`\`\`"
            echo "docker run --rm -p 5002:8080 $IMAGE:champion"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
