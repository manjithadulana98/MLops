# DVC Pipeline Definition
# ──────────────────────────────────────────────────────────────────────────────
# Orchestrates: data loading → model training → evaluation → promotion gate,
#               plus the reference profile used for drift monitoring
#
# Usage:
#   dvc repro              # Run full pipeline
#   dvc repro -s train     # Run specific stage
#   dvc dag                # View DAG
#   dvc exp run -S configs/training_config.yaml:dataset.sample_fraction=0.01 \
#               -S configs/training_config.yaml:training.epochs=1     # quick experiment
#   dvc exp show           # compare experiments (params + metrics)
#
# IEC 62304 Ref: SRS-PIPELINE-001

stages:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1: Prepare MIT dataset (caching + preprocessing)
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    cmd: python -m src.ingestion.prepare --config configs/training_config.yaml
    deps:
      - data/MIT_dataset
      - src/ingestion/prepare.py
      - src/ingestion/load_mit_dataset.py
    outs:
      - data/processed/mit_cache/mit_preprocessed.npz
    params:
      - configs/training_config.yaml:
          - dataset.mit_path
          - dataset.cache_dir
          - dataset.test_size
          - dataset.val_size
          - dataset.sample_fraction
          - dataset.force_recompute

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2: Train VGG16 transfer learning model
  # ──────────────────────────────────────────────────────────────────────────
  train:
    cmd: python -m src.training.train --config configs/training_config.yaml
    deps:
      - data/processed/mit_cache/mit_preprocessed.npz
      - src/ingestion/load_mit_dataset.py
      - src/training/train.py
      - src/training/model.py
      - configs/training_config.yaml
    outs:
      - models/artifacts/vgg16_best.keras
    metrics:
      - models/metrics.json:
          cache: false
    params:
    - configs/training_config.yaml:
      - model
      - training
      - mlflow

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 3: Evaluate model on test set
  # ──────────────────────────────────────────────────────────────────────────
  evaluate:
    cmd: >
      python -m src.evaluation.pipeline
      --model models/artifacts/vgg16_best.keras
      --config configs/training_config.yaml
      --output reports/evaluation_report.json
    deps:
      - data/processed/mit_cache/mit_preprocessed.npz
      - models/artifacts/vgg16_best.keras
      - src/ingestion/load_mit_dataset.py
      - src/evaluation/pipeline.py
      - src/evaluation/evaluate.py
      - configs/training_config.yaml
    outs:
      - reports/evaluation_report.json
      - plots/roc_curve.png
      - plots/confusion_matrix.png
      - plots/pr_curve.png

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 4: Promotion gate — check metrics against gate.thresholds and, if
  # they pass, promote the MLflow `challenger` version to `champion`.
  # Fails (non-zero exit) when any threshold is missed.
  # ──────────────────────────────────────────────────────────────────────────
  gate:
    cmd: >
      python -m src.evaluation.gate
      --config configs/training_config.yaml
      --report reports/evaluation_report.json
      --output reports/gate.json
    deps:
      - reports/evaluation_report.json
      - src/evaluation/gate.py
      - src/registry.py
    params:
      - configs/training_config.yaml:
          - gate
    metrics:
      - reports/gate.json:
          cache: false

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 5: Reference profile for drift monitoring — monitoring features and
  # model predictions on the test split. Served traffic is compared against
  # it by `python -m src.monitoring.drift` (not a pipeline stage: it runs on
  # live prediction logs, not on versioned data).
  # ──────────────────────────────────────────────────────────────────────────
  reference:
    cmd: >
      python -m src.monitoring.reference
      --config configs/training_config.yaml
      --model models/artifacts/vgg16_best.keras
      --output data/monitoring/reference.csv
    deps:
      - data/processed/mit_cache/mit_preprocessed.npz
      - models/artifacts/vgg16_best.keras
      - src/ingestion/load_mit_dataset.py
      - src/monitoring/features.py
      - src/monitoring/reference.py
    params:
      - configs/training_config.yaml:
          - dataset.test_size
          - dataset.val_size
          - dataset.sample_fraction
    outs:
      - data/monitoring/reference.csv

# ──────────────────────────────────────────────────────────────────────────────
# Parameters tracked across pipeline (allow grid search)
# ──────────────────────────────────────────────────────────────────────────────
params:
  - configs/training_config.yaml
